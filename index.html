<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>単位あたり計算</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f6f4;
      --sheet: #ffffff;
      --grid: #d4dddf;
      --grid-dark: #a8b7bc;
      --header: #eef2f0;
      --text: #172126;
      --muted: #5f6e75;
      --green: #167a46;
      --green-dark: #0f5f35;
      --green-soft: #edf8f2;
      --warn: #a34713;
      --shadow: 0 10px 24px rgba(26, 45, 55, .10);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100svh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
    }

    button,
    input {
      font: inherit;
    }

    .app {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--green);
      color: #fff;
      padding: max(12px, env(safe-area-inset-top)) 14px 10px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, .16);
    }

    .topbar-inner {
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      max-width: 720px;
      margin: 0 auto;
      gap: 8px;
    }

    .icon-button {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: inherit;
      background: rgba(255, 255, 255, .13);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .icon-button:active {
      transform: scale(.97);
      background: rgba(255, 255, 255, .22);
    }

    .title-block {
      min-width: 0;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
      font-weight: 700;
    }

    .subtitle {
      margin-top: 2px;
      font-size: 12px;
      color: rgba(255, 255, 255, .82);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    main {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 10px 8px 248px;
      flex: 1;
    }

    .summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 8px;
    }

    .summary-cell {
      background: var(--sheet);
      border: 1px solid var(--grid);
      border-radius: 4px;
      padding: 8px 10px;
      min-width: 0;
    }

    .summary-label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
      margin-bottom: 4px;
    }

    .summary-value {
      display: block;
      font-variant-numeric: tabular-nums;
      font-size: 18px;
      line-height: 1.15;
      font-weight: 700;
      color: var(--green-dark);
      overflow-wrap: anywhere;
    }

    .sheet {
      background: var(--sheet);
      border: 1px solid var(--grid-dark);
      border-radius: 4px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .sheet-head,
    .row {
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr);
    }

    .corner,
    .row-number {
      background: var(--header);
      border-right: 1px solid var(--grid);
      color: var(--muted);
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 600;
    }

    .column-labels,
    .fields {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 62px minmax(0, 1fr) minmax(0, 1.1fr);
    }

    .column-labels span {
      min-width: 0;
      background: var(--header);
      border-right: 1px solid var(--grid);
      border-bottom: 1px solid var(--grid);
      color: var(--muted);
      font-size: 12px;
      line-height: 1;
      font-weight: 700;
      text-align: center;
      padding: 8px 3px;
    }

    .column-labels span:last-child {
      border-right: 0;
    }

    .row {
      min-height: 54px;
      border-bottom: 1px solid var(--grid);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .row:last-child {
      border-bottom: 0;
    }

    .row.active-row {
      box-shadow: inset 0 0 0 2px var(--green);
    }

    .row.active-row .row-number {
      background: var(--green);
      color: #fff;
    }

    .row-number {
      border-bottom: 0;
    }

    .fields {
      align-items: stretch;
    }

    .field,
    .op-cell,
    .result-cell {
      min-width: 0;
      border-right: 1px solid var(--grid);
      padding: 5px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0;
    }

    .result-cell {
      background: #fbfdfc;
    }

    .fields > :last-child {
      border-right: 0;
    }

    input[type="number"] {
      width: 100%;
      height: 42px;
      border: 0;
      border-radius: 0;
      padding: 7px 6px;
      background: transparent;
      color: var(--text);
      font-size: 17px;
      line-height: 1.2;
      text-align: right;
      font-variant-numeric: tabular-nums;
      outline: none;
    }

    input[type="number"]:focus {
      background: #fff;
      box-shadow: inset 0 0 0 2px var(--green);
    }

    .operator-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3px;
    }

    .operator {
      min-height: 20px;
      border: 1px solid transparent;
      border-radius: 4px;
      background: #fff;
      color: var(--text);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .operator.active {
      border-color: var(--green);
      background: var(--green);
      color: #fff;
    }

    .operator:active {
      transform: scale(.97);
    }

    .result-value {
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      border: 0;
      border-radius: 0;
      padding: 7px 6px;
      background: var(--green-soft);
      color: var(--green-dark);
      font-size: 17px;
      line-height: 1.15;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
      text-align: right;
    }
    .message {
      color: var(--warn);
      font-size: 10px;
      line-height: 1.25;
      min-height: 0;
      text-align: right;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .action {
      min-height: 48px;
      border: 1px solid var(--grid-dark);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .action.primary {
      border-color: var(--green);
      background: var(--green);
      color: #fff;
    }

    .action:active {
      transform: scale(.99);
    }

    .keypad {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      padding: 8px 8px max(8px, env(safe-area-inset-bottom));
      background: rgba(243, 246, 244, .96);
      border-top: 1px solid var(--grid-dark);
      box-shadow: 0 -10px 24px rgba(26, 45, 55, .14);
      backdrop-filter: blur(10px);
    }

    .keypad-inner {
      max-width: 720px;
      margin: 0 auto;
    }

    .entry-display {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      margin-bottom: 7px;
    }

    .entry-row {
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid var(--grid-dark);
      border-radius: 4px;
      background: var(--header);
      color: var(--green-dark);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .entry-expression {
      min-width: 0;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      border: 1px solid var(--grid-dark);
      border-radius: 4px;
      padding: 6px 10px;
      background: #fff;
      color: var(--text);
      font-size: 20px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .key {
      min-height: 44px;
      border: 1px solid var(--grid-dark);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      font-size: 19px;
      font-weight: 800;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
    }

    .key:active {
      transform: scale(.98);
    }

    .key.op-key {
      background: #f7faf8;
      color: var(--green-dark);
    }

    .key.utility-key {
      color: var(--muted);
      font-size: 15px;
    }

    .key.enter-key {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
      grid-row: span 2;
    }

    .key.zero-key {
      grid-column: span 2;
    }

    @media (max-width: 430px) {
      main {
        padding-inline: 8px;
        padding-bottom: 238px;
      }

      .column-labels,
      .fields {
        grid-template-columns: minmax(0, 1fr) 58px minmax(0, 1fr) minmax(0, 1.1fr);
      }

      .field,
      .op-cell,
      .result-cell {
        padding: 4px;
      }

      input[type="number"],
      .result-value {
        font-size: 16px;
      }

      .key {
        min-height: 42px;
        font-size: 18px;
      }

      .entry-expression {
        font-size: 19px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-inner">
        <button class="icon-button" type="button" id="clearAll" aria-label="全消去">
          <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h16M10 11v6M14 11v6M6 7l1 14h10l1-14M9 7l1-4h4l1 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="title-block">
          <h1>単位あたり計算</h1>
          <div class="subtitle">下のキーで連続入力</div>
        </div>
        <button class="icon-button" type="button" id="addRowTop" aria-label="行を追加">
          <svg width="23" height="23" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </header>

    <main>
      <section class="summary" aria-label="集計">
        <div class="summary-cell">
          <span class="summary-label">入力済み行</span>
          <span class="summary-value" id="filledCount">0</span>
        </div>
        <div class="summary-cell">
          <span class="summary-label">結果合計</span>
          <span class="summary-value" id="resultTotal">0</span>
        </div>
      </section>

      <section class="sheet" aria-label="計算表">
        <div class="sheet-head">
          <div class="corner"></div>
          <div class="column-labels">
            <span>A 数値</span>
            <span>演算</span>
            <span>B 数値</span>
            <span>C 結果</span>
          </div>
        </div>
        <div id="rows"></div>
      </section>

      <div class="actions">
        <button class="action primary" type="button" id="addRowBottom">行を追加</button>
        <button class="action" type="button" id="resetRows">6行に戻す</button>
      </div>
    </main>

    <footer class="keypad" aria-label="計算キーボード">
      <div class="keypad-inner">
        <div class="entry-display">
          <div class="entry-row" id="activeRowLabel">1</div>
          <div class="entry-expression" id="entryExpression">0</div>
        </div>
        <div class="keys">
          <button class="key utility-key" type="button" data-key="clear">C</button>
          <button class="key utility-key" type="button" data-key="back">⌫</button>
          <button class="key op-key" type="button" data-key="+">+</button>
          <button class="key op-key" type="button" data-key="*">×</button>
          <button class="key" type="button" data-key="7">7</button>
          <button class="key" type="button" data-key="8">8</button>
          <button class="key" type="button" data-key="9">9</button>
          <button class="key op-key" type="button" data-key="/">÷</button>
          <button class="key" type="button" data-key="4">4</button>
          <button class="key" type="button" data-key="5">5</button>
          <button class="key" type="button" data-key="6">6</button>
          <button class="key op-key" type="button" data-key="-">−</button>
          <button class="key" type="button" data-key="1">1</button>
          <button class="key" type="button" data-key="2">2</button>
          <button class="key" type="button" data-key="3">3</button>
          <button class="key enter-key" type="button" data-key="enter">=</button>
          <button class="key zero-key" type="button" data-key="0">0</button>
          <button class="key" type="button" data-key=".">.</button>
        </div>
      </div>
    </footer>
  </div>

  <template id="rowTemplate">
    <div class="row">
      <div class="row-number"></div>
      <div class="fields">
        <div class="field">
          <input class="value-a" type="number" inputmode="decimal" step="any" placeholder="0" aria-label="左の数値" readonly>
        </div>

        <div class="op-cell">
          <div class="operator-group" role="group" aria-label="演算子">
            <button class="operator active" type="button" data-op="/">÷</button>
            <button class="operator" type="button" data-op="*">×</button>
            <button class="operator" type="button" data-op="+">+</button>
            <button class="operator" type="button" data-op="-">−</button>
          </div>
        </div>

        <div class="result-cell">
          <input class="value-b" type="number" inputmode="decimal" step="any" placeholder="0" aria-label="右の数値" readonly>
        </div>

        <div class="result-cell">
          <div class="result-value">0</div>
          <div class="message"></div>
        </div>
      </div>
    </div>
  </template>

  <script>
    const rowsEl = document.querySelector("#rows");
    const template = document.querySelector("#rowTemplate");
    const filledCountEl = document.querySelector("#filledCount");
    const resultTotalEl = document.querySelector("#resultTotal");
    const activeRowLabelEl = document.querySelector("#activeRowLabel");
    const entryExpressionEl = document.querySelector("#entryExpression");
    const operators = {
      "/": { label: "÷" },
      "*": { label: "×" },
      "+": { label: "+" },
      "-": { label: "−" }
    };
    const entry = { a: "", op: "", b: "" };
    let activeRow = null;

    function formatNumber(value) {
      if (!Number.isFinite(value)) return "";
      const rounded = Math.abs(value) >= 100000000
        ? value.toPrecision(8)
        : Number(value.toFixed(8)).toString();
      return Number(rounded).toLocaleString("ja-JP", {
        minimumFractionDigits: 1,
        maximumFractionDigits: 1
      });
    }

    function calculate(a, b, op) {
      if (op === "/" && b === 0) return { value: null, message: "0では割れません" };
      if (op === "+") return { value: a + b, message: "" };
      if (op === "-") return { value: a - b, message: "" };
      if (op === "*") return { value: a * b, message: "" };
      return { value: a / b, message: "" };
    }

    function displayExpression() {
      const parts = [];
      if (entry.a) parts.push(entry.a);
      if (entry.op) parts.push(operators[entry.op].label);
      if (entry.b) parts.push(entry.b);
      entryExpressionEl.textContent = parts.join(" ") || "0";
    }

    function clearEntry() {
      entry.a = "";
      entry.op = "";
      entry.b = "";
      displayExpression();
    }

    function activeRows() {
      return [...rowsEl.querySelectorAll(".row")];
    }

    function setActiveRow(row) {
      activeRows().forEach((current) => current.classList.remove("active-row"));
      activeRow = row;
      activeRow.classList.add("active-row");
      activeRowLabelEl.textContent = activeRow.querySelector(".row-number").textContent;
    }

    function moveToNextRow() {
      const rows = activeRows();
      const currentIndex = rows.indexOf(activeRow);
      const nextRow = rows[currentIndex + 1] || addRow();
      setActiveRow(nextRow);
      nextRow.scrollIntoView({ block: "nearest" });
    }

    function appendNumberKey(key) {
      const target = entry.op ? "b" : "a";
      if (key === "." && entry[target].includes(".")) return;
      if (key === "." && entry[target] === "") {
        entry[target] = "0.";
      } else if (entry[target] === "0" && key !== ".") {
        entry[target] = key;
      } else {
        entry[target] += key;
      }
      displayExpression();
    }

    function setEntryOperator(op) {
      if (!entry.a) return;
      entry.op = op;
      displayExpression();
    }

    function backspaceEntry() {
      if (entry.b) {
        entry.b = entry.b.slice(0, -1);
      } else if (entry.op) {
        entry.op = "";
      } else {
        entry.a = entry.a.slice(0, -1);
      }
      displayExpression();
    }

    function commitEntry() {
      if (!activeRow || !entry.a || !entry.op || !entry.b) return;
      activeRow.querySelector(".value-a").value = entry.a;
      activeRow.querySelector(".value-b").value = entry.b;
      activeRow.querySelectorAll(".operator").forEach((op) => op.classList.remove("active"));
      activeRow.querySelector(`[data-op="${entry.op}"]`).classList.add("active");
      updateRow(activeRow);
      clearEntry();
      moveToNextRow();
    }

    function handleKey(key) {
      if (/^[0-9.]$/.test(key)) appendNumberKey(key);
      if (["/", "*", "+", "-"].includes(key)) setEntryOperator(key);
      if (key === "back") backspaceEntry();
      if (key === "clear") clearEntry();
      if (key === "enter") commitEntry();
    }

    function updateRow(row) {
      const inputA = row.querySelector(".value-a");
      const inputB = row.querySelector(".value-b");
      const activeOp = row.querySelector(".operator.active").dataset.op;
      const resultEl = row.querySelector(".result-value");
      const messageEl = row.querySelector(".message");
      const hasA = inputA.value !== "";
      const hasB = inputB.value !== "";

      if (!hasA || !hasB) {
        resultEl.textContent = "0";
        messageEl.textContent = "";
        row.dataset.result = "";
        updateSummary();
        return;
      }

      const a = Number(inputA.value);
      const b = Number(inputB.value);
      const result = calculate(a, b, activeOp);

      if (result.value === null) {
        resultEl.textContent = "-";
        messageEl.textContent = result.message;
        row.dataset.result = "";
        updateSummary();
        return;
      }

      resultEl.textContent = formatNumber(result.value);
      messageEl.textContent = "";
      row.dataset.result = String(result.value);
      updateSummary();
    }

    function updateSummary() {
      const rows = [...rowsEl.querySelectorAll(".row")];
      const values = rows
        .map((row) => Number(row.dataset.result))
        .filter(Number.isFinite);
      filledCountEl.textContent = String(values.length);
      resultTotalEl.textContent = formatNumber(values.reduce((sum, value) => sum + value, 0)) || "0";
    }

    function renumberRows() {
      [...rowsEl.querySelectorAll(".row-number")].forEach((cell, index) => {
        cell.textContent = String(index + 1);
      });
    }

    function addRow() {
      const row = template.content.firstElementChild.cloneNode(true);
      row.addEventListener("click", () => setActiveRow(row));
      row.querySelectorAll(".operator").forEach((button) => {
        button.addEventListener("click", () => {
          row.querySelectorAll(".operator").forEach((op) => op.classList.remove("active"));
          button.classList.add("active");
          updateRow(row);
        });
      });
      rowsEl.appendChild(row);
      renumberRows();
      updateSummary();
      return row;
    }

    function clearAll() {
      rowsEl.querySelectorAll("input").forEach((input) => {
        input.value = "";
      });
      rowsEl.querySelectorAll(".row").forEach((row) => {
        row.querySelectorAll(".operator").forEach((op) => op.classList.remove("active"));
        row.querySelector('[data-op="/"]').classList.add("active");
        updateRow(row);
      });
      setActiveRow(rowsEl.querySelector(".row"));
      clearEntry();
    }

    function resetRows() {
      rowsEl.innerHTML = "";
      for (let i = 0; i < 6; i += 1) addRow();
      setActiveRow(rowsEl.querySelector(".row"));
      clearEntry();
      updateSummary();
    }

    function addRowAndSelect() {
      setActiveRow(addRow());
    }

    document.querySelector("#addRowTop").addEventListener("click", addRowAndSelect);
    document.querySelector("#addRowBottom").addEventListener("click", addRowAndSelect);
    document.querySelector("#clearAll").addEventListener("click", clearAll);
    document.querySelector("#resetRows").addEventListener("click", resetRows);
    document.querySelectorAll("[data-key]").forEach((button) => {
      button.addEventListener("click", () => handleKey(button.dataset.key));
    });
    document.querySelector(".keypad").addEventListener("dblclick", (event) => {
      event.preventDefault();
    });
    window.addEventListener("keydown", (event) => {
      const keyMap = { "Enter": "enter", "=": "enter", "Backspace": "back", "Escape": "clear" };
      const key = keyMap[event.key] || event.key;
      if (/^[0-9.]$/.test(key) || ["/", "*", "+", "-", "enter", "back", "clear"].includes(key)) {
        event.preventDefault();
        handleKey(key);
      }
    });

    resetRows();
  </script>
</body>
</html>
